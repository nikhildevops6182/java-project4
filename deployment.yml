
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java4-deployment
  labels:
    app: java4-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java4-app
  template:
    metadata:
      labels:
        app: java4-app
    spec:
      containers:
        - name: java4-app
          image: snk6182/java-project4:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
